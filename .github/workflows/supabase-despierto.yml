# Supabase gratis se pausa tras 7 días sin uso. Esto le hace una consulta cada día para que no se duerma.
name: Supabase despierto

on:
  schedule:
    - cron: "17 6 * * *" # cada día a las 06:17 UTC
  workflow_dispatch: {}

permissions:
  actions: write # para volver a activar este flujo (GitHub para los programados tras 60 días sin cambios)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a Supabase
        env:
          # Dirección y clave pública del proyecto: son públicas, ya van dentro de la web.
          URL: https://dbxflcuayuenxygavhqx.supabase.co
          KEY: sb_publishable_NUlUDhmHEBpZ1YJaVCn1DA__xPK2LdS
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/club_por_codigo" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_codigo":"PING"}')
          echo "Supabase respondió $code"
          test "$code" = "200"
      - name: Mantener activo este flujo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-despierto.yml/enable" || true
